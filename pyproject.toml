[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misinfo-agent"
version = "0.1.0"
description = "Agentic LLM claim investigator, evaluated head-to-head against a single-shot RAG baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.40",
    "tavily-python>=0.5",
    "tenacity>=8.5",
]
demo = [
    "gradio>=5.0",
]
scrape = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["misinfo_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
